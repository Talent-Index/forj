<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ebe4d6" />
    <title>Forjora — Page not found</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1916;
        --muted: #6b6560;
        --surface: #fffefb;
        --bg: #ebe4d6;
        --accent: #c45c26;
        --border: #d8d0c4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        width: min(100%, 28rem);
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px 24px;
      }
      .kicker {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--accent);
        color: #fffefb;
        text-decoration: none;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>Path not forged</h1>
      <p>This page is not part of Forjora. Return home to keep learning, forging, and proving.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
